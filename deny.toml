# cargo-deny for the agent: licences, advisories, sources. Everything here ships into
# a company's network, so unknown registries and git sources are refused.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# crates/iohr-capture-ebpf (MIT OR GPL-2.0) is not a workspace member and has its own
# deny.toml with the one GPL-2.0 exception (docs/adr/0002-capture-companion.md).
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
]
# foldhash (hashbrown's default hasher, through aya, for iohr-capture) is Zlib: permissive,
# OSI and FSF approved. Allowed for that crate only.
exceptions = [{ crate = "foldhash", allow = ["Zlib"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
