{{- if .Values.networkPolicy.enabled }}
# Nothing may connect to the agent; it may reach DNS and the listed CIDRs only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iohr-agent.fullname" . }}
  labels:
    {{- include "iohr-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "iohr-agent.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- range .Values.networkPolicy.egressCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . }}
    {{- end }}
{{- end }}
