apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iohr-agent.fullname" . }}
  labels:
    {{- include "iohr-agent.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if include "iohr-agent.k8sAccess" . }}
---
# Read-only access to exactly the Secrets named in values, for `k8s:` references.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "iohr-agent.fullname" . }}-secrets
  labels:
    {{- include "iohr-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      {{- toYaml .Values.secrets.kubernetes.secretNames | nindent 6 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "iohr-agent.fullname" . }}-secrets
  labels:
    {{- include "iohr-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "iohr-agent.fullname" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "iohr-agent.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
