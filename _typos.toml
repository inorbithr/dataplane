[default]
# The ISO 3166-1 country codes (crates/iohr-agent/src/metadata.rs) are not words.
extend-ignore-re = ['(?s)const ISO_3166_1_ALPHA_2.*?\];']

[default.extend-words]
hr = "hr"
# setpriv --inh-caps (tools/capture_e2e_guest.py)
inh = "inh"
# /proc/net/snmp field names (RtoAlgorithm, RtoMin, RtoMax; crates/iohr-capture/src/procnet.rs)
rto = "rto"

[files]
# CHANGELOG.md is written by release-please; commit hashes in it (ba2c85d) read as typos.
extend-exclude = ["LICENSE", "CODE_OF_CONDUCT.md", "CHANGELOG.md", "crates/iohr-agent/tests/fixtures/*", "crates/iohr-capture/tests/fixtures/*", "*.svg"]
