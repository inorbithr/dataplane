[package]
name = "iohr-capture"
description = "The InOrbit capture companion: loads eBPF traffic counters, drops its privileges, reports counts only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
readme = "../../docs/capture/install.md"

[[bin]]
name = "iohr-capture"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "signal", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
aya.workspace = true
iohr-capture-common = { path = "../iohr-capture-common", features = ["user"] }
rustix.workspace = true

[build-dependencies]
# Compiles crates/iohr-capture-ebpf (not a workspace member: its own Cargo.lock, nightly
# and licence) for the BPF target; build.rs reruns when that directory changes.
aya-build.workspace = true

[lints]
workspace = true

