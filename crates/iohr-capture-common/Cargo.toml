[package]
name = "iohr-capture-common"
description = "Record types shared by the iohr-capture eBPF programs and the iohr-capture daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
# User space only: implements `aya::Pod` so the daemon can read these types from maps.
user = ["dep:aya"]

[target.'cfg(target_os = "linux")'.dependencies]
aya = { workspace = true, optional = true }

# The workspace lints, except `unsafe_code`: `deny` here instead of `forbid`, so the one
# `unsafe impl aya::Pod` below can allow it (docs/adr/0002-capture-companion.md).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
