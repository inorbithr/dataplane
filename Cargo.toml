[workspace]
resolver = "3"
members = ["crates/iohr-agent", "crates/iohr-capture", "crates/iohr-capture-common"]
# The eBPF programs build for the BPF target with a pinned nightly, through
# crates/iohr-capture/build.rs (aya-build); never with the workspace's stable toolchain.
exclude = ["crates/iohr-capture-ebpf"]

[workspace.package]
version = "0.1.0-alpha.6"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/inorbithr/dataplane"
homepage = "https://docs.inorbit.hr"
publish = false

# Small on purpose: every crate here ends up inside a company's network (docs/adr/0001).
[workspace.dependencies]
# iohr-capture only (docs/adr/0002): eBPF loading in user space, the build-time eBPF
# compile, and safe wrappers for capabilities and rlimits.
aya = { version = "0.14.0", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["std", "thread", "process", "system", "net", "fs", "time"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
ed25519-dalek = { version = "3", features = ["pkcs8", "pem"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
h2 = "0.4"
http = "1"
ipnet = "2"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry-appender-tracing = "0.33"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "signal", "fs", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
toml = "1"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json", "std", "ansi"] }
url = { version = "2", features = ["serde"] }
zeroize = "1"

axum = { version = "0.8", features = ["ws"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
