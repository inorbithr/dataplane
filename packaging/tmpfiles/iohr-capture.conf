# iohr-capture: pcap files made on request expire. The running companion deletes them
# after IOHR_CAPTURE_PCAP_RETENTION_SECS and its unit's ExecStopPost deletes them when it
# stops; this line is the safety net for a host that went down hard (systemd-tmpfiles
# cleans by age on its daily timer). Keep the age in step with the retention.
e /var/lib/iohr-capture/pcap - - - 1h
