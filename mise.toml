# Toolchains and tasks. `mise install`, then `mise run ci` runs what CI runs.
# Release tasks build what the release workflow builds, so a release can be rehearsed
# (and our internal dogfood channel fed) without GitHub Actions (docs/releasing.md).

[settings]
experimental = true
cargo.binstall = true

[tools]
# Two Rust toolchains: stable builds everything; the pinned nightly (with rust-src) builds
# only the eBPF programs in crates/iohr-capture-ebpf, whose rust-toolchain.toml names the
# same nightly (`mise run capture:toolchain-check`). bpf-linker links them (LLVM 23).
rust = [
  { version = "1.99.0", components = "rustfmt,clippy", targets = "x86_64-unknown-linux-musl,aarch64-unknown-linux-musl" },
  { version = "nightly-2026-10-05", components = "rust-src,clippy,rustfmt" },
]
"cargo:bpf-linker" = "0.11.1"
cargo-binstall = "1.25.1"
"cargo:cargo-nextest" = "0.9.146"
cargo-deny = "0.20.2"
"cargo:cargo-cyclonedx" = "0.5.9"
"cargo:cargo-deb" = "3.8.0"
"cargo:cargo-generate-rpm" = "0.21.0"
helm = "4.3.0"
cosign = "3.1.3"
oras = "1.3.4"
typos = "1.50.3"
actionlint = "1.7.12"
zizmor = "1.30.1"
shellcheck = "0.11.0"
cyclonedx = "0.33.1"

[env]
NO_COLOR = "1"
CARGO_TERM_COLOR = "never"
# One target directory inside the repository (the disk is shared; `mise run clean`).
CARGO_TARGET_DIR = "{{config_root}}/target"

# ---------------------------------------------------------------- checks

[tasks.ci]
description = "Everything CI checks, in the same order"
depends = ["repo:check", "check", "helm:check"]

[tasks.check]
shell = "bash -e -o pipefail -c"
description = "fmt, clippy (pedantic, -D warnings), nextest, doctests, cargo-deny"
run = """
cargo fmt --all --check
cargo clippy --locked --all-targets --all-features -- -D warnings
cargo nextest run --locked --all-features
cargo test --locked --doc --all-features
cargo deny check
mise run capture:ebpf-check
"""

[tasks."capture:ebpf-check"]
shell = "bash -e -o pipefail -c"
description = "The eBPF crate (not a workspace member): toolchain pin, fmt, clippy for the BPF target, cargo-deny"
dir = "{{config_root}}/crates/iohr-capture-ebpf"
run = """
mise run capture:toolchain-check
# mise puts the stable toolchain first on PATH; name the pinned nightly explicitly.
nightly=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)
rustup run "$nightly" cargo fmt --check
rustup run "$nightly" cargo clippy --locked --release --target bpfel-unknown-none -Z build-std=core -- -D warnings
cargo deny --manifest-path Cargo.toml check licenses bans sources
"""

[tasks."capture:toolchain-check"]
shell = "bash -e -o pipefail -c"
description = "The nightly pinned in mise.toml is the one crates/iohr-capture-ebpf/rust-toolchain.toml names"
run = """
pin=$(grep '^channel' crates/iohr-capture-ebpf/rust-toolchain.toml | cut -d'"' -f2)
grep -q "version = .$pin.," mise.toml || { echo "rust-toolchain.toml names $pin; mise.toml pins another nightly" >&2; exit 1; }
"""

[tasks."capture:e2e"]
shell = "bash -e -o pipefail -c"
description = "iohr-capture in throwaway VMs (virtme-ng + QEMU/KVM) on kernels 5.15, 6.6, 6.12; never on this host"
run = "tools/capture-e2e.sh"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.test]
description = "Unit and integration tests"
run = "cargo nextest run --locked --all-features"

[tasks."repo:check"]
shell = "bash -e -o pipefail -c"
description = "Spelling, shell scripts, workflow lint and workflow security audit"
run = [
  "typos",
  "shellcheck tools/*.sh packaging/deb/* packaging/deb-capture/* packaging/macos/*.sh",
  "actionlint",
  "zizmor --min-severity low .github/workflows",
]

[tasks."helm:check"]
shell = "bash -e -o pipefail -c"
description = "Lint and render the Helm chart"
run = """
helm lint charts/iohr-agent --strict --set environment=staging
helm template t charts/iohr-agent --set environment=staging,enrollment.existingSecret=t,secrets.kubernetes.secretNames={a},secrets.vault.addr=https://vault.example:8200,secrets.vault.tokenSecret.name=v,networkPolicy.enabled=true,networkPolicy.egressCIDRs={10.0.0.0/8} > /dev/null
helm template t charts/iohr-agent --set environment=staging,checks.existingConfigMap=c > /dev/null
rendered=$(helm template t charts/iohr-agent --set environment=staging,metadata.placement.country=DE,metadata.environment.tier=production,metadata.compliance.regimes={gdpr})
grep -qF '    [metadata.placement]' <<<"$rendered" && grep -qF '    country = \"DE\"' <<<"$rendered" || { echo "metadata values do not render into agent.toml" >&2; exit 1; }
if helm template t charts/iohr-agent > /dev/null 2>&1; then echo "environment must be required" >&2; exit 1; fi
"""

[tasks.audit]
description = "Known vulnerabilities in dependencies"
run = "cargo deny check advisories"

[tasks.clean]
description = "Remove build output (shared disk)"
run = "rm -rf target dist"

# ---------------------------------------------------------------- release, locally

[tasks."dist:bin"]
shell = "bash -e -o pipefail -c"
description = "Static release binaries for Linux (musl) into dist/bin/<os>-<arch>/"
run = "tools/dist-bin.sh"

[tasks."dist:packages"]
shell = "bash -e -o pipefail -c"
description = ".deb and .rpm with the systemd unit, from dist/bin"
depends = ["dist:bin"]
run = "tools/dist-packages.sh"

[tasks."dist:sbom"]
shell = "bash -e -o pipefail -c"
description = "CycloneDX SBOMs of the binaries into dist/sbom (iohr-capture's includes its eBPF programs)"
run = """
mkdir -p dist/sbom
for c in iohr-agent iohr-capture iohr-capture-ebpf; do
  cargo cyclonedx --manifest-path "crates/$c/Cargo.toml" --format json --spec-version 1.5 --override-filename "$c.cdx"
  mv "crates/$c/$c.cdx.json" "dist/sbom/$c.cdx.json"
done
# One SBOM per shipped binary: the eBPF object is embedded in iohr-capture.
cyclonedx merge --hierarchical --name iohr-capture --version "$(cargo pkgid -p iohr-capture | sed 's/.*[#@]//')" \
  --input-files dist/sbom/iohr-capture.cdx.json dist/sbom/iohr-capture-ebpf.cdx.json \
  --output-file dist/sbom/iohr-capture.merged.cdx.json --output-version v1_5
mv dist/sbom/iohr-capture.merged.cdx.json dist/sbom/iohr-capture.cdx.json
rm dist/sbom/iohr-capture-ebpf.cdx.json
for c in iohr-agent iohr-capture; do
  cyclonedx validate --input-file "dist/sbom/$c.cdx.json" --input-version v1_5 --fail-on-errors
done
"""

[tasks."dist:vex"]
shell = "bash -e -o pipefail -c"
description = "The OpenVEX statement for this version into dist/"
run = "python3 tools/vex.py > dist/iohr-agent.openvex.json"

[tasks."release:local"]
shell = "bash -e -o pipefail -c"
description = "Build image + chart + extension artifact and push them, signed with a local key, to $IOHR_DOGFOOD_REGISTRY"
depends = ["dist:bin", "dist:sbom"]
run = "tools/release-local.sh"
