# The release of a tag v<version> (docs/releasing.md). Three stages, split so that no step
# that runs repository code can reach signing material:
#
#   build     per platform, on GitHub-hosted runners: compiles the binaries. No id-token,
#             no registry write.
#   assemble  image, chart, extension artifact, packages, SBOM, VEX; pushes them by digest
#             to ghcr.io. packages: write only.
#   sign      runs no repository build steps: cosign keyless signatures, the extension's
#             Sigstore bundles as OCI referrers, SLSA v1 provenance and SBOM attestations
#             by GitHub's attestation actions, then the GitHub release.
#
# The signer identity iohr checks is this file at a tag:
#   https://github.com/inorbithr/dataplane/.github/workflows/release.yml@refs/tags/v*
# Renaming this file or the environment breaks verification for every user.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MISE_YES: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  REGISTRY: ghcr.io/inorbithr

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # iohr-capture (eBPF) is Linux only; its build needs the pinned nightly and bpf-linker.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, dir: linux-amd64, tools: "rust cargo-binstall cargo:bpf-linker", bins: "iohr-agent iohr-capture" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, dir: linux-arm64, tools: "rust cargo-binstall cargo:bpf-linker", bins: "iohr-agent iohr-capture" }
          - { os: macos-15, target: aarch64-apple-darwin, dir: darwin-arm64, tools: "rust", bins: "iohr-agent" }
          - { os: macos-15, target: x86_64-apple-darwin, dir: darwin-amd64, tools: "rust", bins: "iohr-agent" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          install_args: ${{ matrix.tools }}
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          DIR: ${{ matrix.dir }}
          BINS: ${{ matrix.bins }}
        run: |
          rustup target add "$TARGET"
          if [[ "$TARGET" == *-linux-musl ]]; then export "CC_${TARGET//-/_}=gcc"; fi
          mkdir -p "dist/bin/$DIR"
          for b in $BINS; do
            cargo build --release --locked -p "$b" --target "$TARGET"
            cp "${CARGO_TARGET_DIR:-target}/$TARGET/release/$b" "dist/bin/$DIR/$b"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.dir }}
          path: dist/bin/
          if-no-files-found: error

  assemble:
    name: assemble and push
    needs: build
    runs-on: ubuntu-24.04
    environment: release-agent
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      image_digest: ${{ steps.push.outputs.image_digest }}
      chart_digest: ${{ steps.push.outputs.chart_digest }}
      ext_digest: ${{ steps.push.outputs.ext_digest }}
      capture_digest: ${{ steps.push.outputs.capture_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          install_args: "rust cargo-binstall cargo:cargo-deb cargo:cargo-generate-rpm cargo:cargo-cyclonedx cyclonedx helm oras cargo:bpf-linker"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: dist/bin
          merge-multiple: true
      - id: v
        env:
          REF: ${{ github.ref_name }}
        run: echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
      - run: chmod +x dist/bin/*/iohr-*
      - run: tools/dist-packages.sh
      - run: mise run dist:sbom
      - run: mkdir -p dist && python3 tools/vex.py > dist/iohr-agent.openvex.json
      - name: Archives and checksums
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist/release
          for d in dist/bin/*/; do
            p="$(basename "$d")"
            for b in iohr-agent iohr-capture; do
              [ -f "$d/$b" ] || continue
              tar -C "$d" -czf "dist/release/$b-$VERSION-$p.tar.gz" "$b"
            done
          done
          cp dist/packages/* dist/sbom/iohr-agent.cdx.json dist/sbom/iohr-capture.cdx.json dist/iohr-agent.openvex.json dist/release/
          (cd dist/release && sha256sum -- * > SHA256SUMS)
      - name: Push image, chart and extension
        id: push
        env:
          VERSION: ${{ steps.v.outputs.version }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" \
            --provenance=false --sbom=false \
            --tag "$REGISTRY/iohr-agent:$VERSION" --push --metadata-file dist/image.json .
          image_digest="$(jq -r '."containerimage.digest"' dist/image.json)"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad image digest: $image_digest"; exit 1; }
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"
          # The capture companion's image (Dockerfile.capture: the static binary on distroless).
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$VERSION" \
            --provenance=false --sbom=false -f Dockerfile.capture \
            --tag "$REGISTRY/iohr-capture:$VERSION" --push --metadata-file dist/image-capture.json .
          capture_digest="$(jq -r '."containerimage.digest"' dist/image-capture.json)"
          [[ "$capture_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad capture image digest: $capture_digest"; exit 1; }
          echo "capture_digest=$capture_digest" >> "$GITHUB_OUTPUT"
          helm package charts/iohr-agent --version "$VERSION" --app-version "$VERSION" -d dist/chart
          chart_digest="$(helm push "dist/chart/iohr-agent-$VERSION.tgz" "oci://$REGISTRY/charts" 2>&1 | sed -n 's/^Digest: //p')"
          [[ "$chart_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad chart digest: $chart_digest"; exit 1; }
          echo "chart_digest=$chart_digest" >> "$GITHUB_OUTPUT"
          ext_digest="$(python3 tools/ext_artifact.py --version "$VERSION" --revision "$REVISION" --out dist/oci/ext-agent)"
          oras cp --from-oci-layout "dist/oci/ext-agent:$VERSION" "$REGISTRY/iohr-ext/agent:$VERSION"
          [[ "$ext_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad extension digest: $ext_digest"; exit 1; }
          echo "ext_digest=$ext_digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/release/
            dist/oci/ext-agent/
          if-no-files-found: error

  sign:
    name: sign, attest, publish release
    needs: assemble
    runs-on: ubuntu-24.04
    environment: release-agent
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.assemble.outputs.version }}
      IMAGE_DIGEST: ${{ needs.assemble.outputs.image_digest }}
      CHART_DIGEST: ${{ needs.assemble.outputs.chart_digest }}
      EXT_DIGEST: ${{ needs.assemble.outputs.ext_digest }}
      CAPTURE_DIGEST: ${{ needs.assemble.outputs.capture_digest }}
      BUNDLE: application/vnd.dev.sigstore.bundle.v0.3+json
    steps:
      # Only mise itself and the signing tools; no repository code is built or run here.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
          install: false
      - run: mise use -g cosign@3.0.2 oras@1.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist
      - name: Log in
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | mise x -- cosign login ghcr.io -u "$GH_ACTOR" --password-stdin
          echo "$GH_TOKEN" | mise x -- oras login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Keyless signatures (image and chart, for admission policies)
        run: |
          mise x -- cosign sign --yes "$REGISTRY/iohr-agent@$IMAGE_DIGEST"
          mise x -- cosign sign --yes "$REGISTRY/charts/iohr-agent@$CHART_DIGEST"
          mise x -- cosign sign --yes "$REGISTRY/iohr-capture@$CAPTURE_DIGEST"
      - name: Extension signature bundle (DSSE over the index digest, OCI referrer)
        run: |
          index="dist/oci/ext-agent/blobs/sha256/${EXT_DIGEST#sha256:}"
          [ "sha256:$(sha256sum "$index" | cut -d' ' -f1)" = "$EXT_DIGEST" ]
          printf '{}' > empty.json
          mise x -- cosign attest-blob --yes --new-bundle-format \
            --type https://sigstore.dev/cosign/sign/v1 --predicate empty.json \
            --bundle signature.sigstore.json "$index"
          mise x -- oras attach --artifact-type "$BUNDLE" \
            "$REGISTRY/iohr-ext/agent@$EXT_DIGEST" "signature.sigstore.json:$BUNDLE"
      - id: prov-ext
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/iohr-ext/agent
          subject-digest: ${{ env.EXT_DIGEST }}
      - name: Extension provenance bundle (OCI referrer)
        env:
          BUNDLE_PATH: ${{ steps.prov-ext.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" provenance.sigstore.json
          mise x -- oras attach --artifact-type "$BUNDLE" \
            "$REGISTRY/iohr-ext/agent@$EXT_DIGEST" "provenance.sigstore.json:$BUNDLE"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/iohr-agent
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/charts/iohr-agent
          subject-digest: ${{ env.CHART_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/iohr-capture
          subject-digest: ${{ env.CAPTURE_DIGEST }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/iohr-agent
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: dist/release/iohr-agent.cdx.json
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/release/iohr-agent-*.tar.gz
            dist/release/iohr-agent_*.deb
            dist/release/iohr-agent-*.rpm
          sbom-path: dist/release/iohr-agent.cdx.json
      # iohr-capture: its own SBOM (user space and the embedded eBPF programs), on the image
      # and on the archives and packages.
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/iohr-capture
          subject-digest: ${{ env.CAPTURE_DIGEST }}
          sbom-path: dist/release/iohr-capture.cdx.json
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/release/iohr-capture-*.tar.gz
            dist/release/iohr-capture_*.deb
            dist/release/iohr-capture-*.rpm
          sbom-path: dist/release/iohr-capture.cdx.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp signature.sigstore.json dist/release/iohr-ext-agent.signature.sigstore.json
          cp provenance.sigstore.json dist/release/iohr-ext-agent.provenance.sigstore.json
          # release-please makes the release when it tags; a tag pushed by hand has none yet.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            pre=(); [[ "$TAG" == *-* ]] && pre=(--prerelease)
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${pre[@]}"
          fi
          gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
