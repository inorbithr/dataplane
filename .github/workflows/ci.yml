name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  MISE_YES: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  repo:
    name: repo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: "typos actionlint zizmor shellcheck"
      - run: mise run repo:check

  rust:
    name: rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: "rust cargo-binstall cargo:cargo-nextest cargo-deny cargo:bpf-linker"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run check

  helm:
    name: helm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: "helm"
      - run: mise run helm:check

  # The release path without publishing: static binary, packages, SBOM, image, extension
  # layout. Catches packaging breakage before a tag does.
  package:
    name: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: "rust cargo-binstall cargo:cargo-deb cargo:cargo-generate-rpm cargo:cargo-cyclonedx cyclonedx cargo:bpf-linker"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The bundled sqlite in libsqlite3-sys is compiled by the C compiler dist-bin.sh
      # picks; the host gcc uses glibc headers, so the musl link fails on glibc-only
      # symbols (__memcpy_chk, open64, stat64). musl-gcc compiles it against musl.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: mise run dist:packages
      - run: mise run dist:sbom
      - run: python3 tools/ext_artifact.py --version 0.0.0-ci
      - run: python3 tools/ext_artifact.py --version 0.0.0-ci --extension capture --out dist/oci/ext-capture
      - run: docker build -t iohr-agent:ci . && docker run --rm iohr-agent:ci --version
      - run: docker build -f Dockerfile.capture -t iohr-capture:ci . && docker run --rm iohr-capture:ci --version

  ci-ok:
    name: ci-ok
    if: always()
    needs: [repo, rust, helm, package]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do [ "$r" = success ] || { echo "a required job ended with $r"; exit 1; }; done
